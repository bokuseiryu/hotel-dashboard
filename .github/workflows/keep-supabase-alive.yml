# Supabaseプロジェクトの自動一時停止を防ぐための定期Pingワークフロー
# 3日ごとにSupabase APIにアクセスしてアクティブ状態を維持する

name: Keep Supabase Alive

on:
  schedule:
    # 3日ごとの午前0時（UTC）に実行 → 日本時間09:00
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # GitHubのActionsページから手動実行も可能（テスト用）

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    name: Ping hotel-dashboard Supabase

    steps:
      - name: hotel_data テーブルにPingを送信
        run: |
          echo "=== Supabase hotel-dashboard 定期Ping開始 ==="
          echo "実行日時: $(date '+%Y年%m月%d日 %H:%M UTC')"

          SUPABASE_BASE="https://abfejycabbaicxoewvuj.supabase.co"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_BASE}/rest/v1/hotel_data?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          echo "hotel_data レスポンス: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ hotel_data Ping 成功"
          else
            echo "❌ hotel_data Ping 失敗 - ステータス: $HTTP_STATUS"
            exit 1
          fi

      - name: hotel_improvements テーブルにPingを送信
        run: |
          SUPABASE_BASE="https://abfejycabbaicxoewvuj.supabase.co"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_BASE}/rest/v1/hotel_improvements?select=hotel_key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          echo "hotel_improvements レスポンス: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ hotel_improvements Ping 成功"
          else
            echo "❌ hotel_improvements Ping 失敗 - ステータス: $HTTP_STATUS"
            exit 1
          fi

          echo "=== 定期Ping完了 - $(date '+%Y年%m月%d日 %H:%M UTC') ==="
