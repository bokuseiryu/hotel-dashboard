name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase hotel-dashboard
        run: |
          echo "Keep-Alive: $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://abfejycabbaicxoewvuj.supabase.co/rest/v1/")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "SUCCESS (status=$STATUS, project is alive)"
          else
            echo "FAILED (status=$STATUS, project may be down)"
            exit 1
          fi
