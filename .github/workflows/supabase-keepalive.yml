# Supabase繝励Ο繧ｸ繧ｧ繧ｯ繝医・閾ｪ蜍募●豁｢繧帝亟縺尻eep-Alive繝ｯ繝ｼ繧ｯ繝輔Ο繝ｼ
# /auth/v1/health 縺ｯ隱崎ｨｼ荳崎ｦ√〒蟶ｸ縺ｫ200繧定ｿ斐☆譛繧ょｮ牙ｮ壹＠縺溘お繝ｳ繝峨・繧､繝ｳ繝・name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          echo "Keep-Alive ping: $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "SUCCESS: Supabase is active"
          else
            echo "FAILED: status=$STATUS"
            exit 1
          fi